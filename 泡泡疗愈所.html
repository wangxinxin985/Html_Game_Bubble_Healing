<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>泡泡疗愈所</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05222f;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#eaf6f6;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:radial-gradient(120% 90% at 50% 8%,rgba(10,48,68,.62),rgba(3,16,26,.9));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20;overflow-y:auto}
.screen.active{display:flex}
h1.title{font-size:clamp(34px,7vw,56px);letter-spacing:.14em;margin:0 0 4px;background:linear-gradient(180deg,#ffffff,#9fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(120,220,255,.5));animation:breathe 3.4s ease-in-out infinite;text-align:center}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 12px rgba(120,220,255,.4))}50%{filter:drop-shadow(0 0 30px rgba(140,240,255,.8))}}
.subtitle{color:#9fc6cf;margin:0 0 24px;font-size:13px;letter-spacing:.42em;text-indent:.42em}
.menu{display:flex;flex-direction:column;gap:11px;width:min(80vw,300px)}
.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;min-height:46px;padding:12px 20px;border-radius:999px;font-size:16px;font-weight:600;color:#f2fbff;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);box-shadow:0 4px 16px rgba(45,212,191,.32),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,filter .15s;letter-spacing:.05em}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(160,230,255,.28)}
.btn.gold{background:linear-gradient(135deg,#ffd76b,#f5a83c);color:#4a2c00}
.btn:disabled{filter:grayscale(.85);opacity:.5;cursor:not-allowed}
.btn.small{min-height:38px;font-size:14px;padding:8px 16px}
.panel{width:min(93vw,540px);max-height:88vh;overflow-y:auto;background:rgba(6,30,44,.78);border:1px solid rgba(140,220,255,.22);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:20px;letter-spacing:.1em;color:#dff6ff;text-align:center}
.panel .tip{color:#9fc6cf;font-size:13px;text-align:center;line-height:1.7}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:100%}
.lvl-btn{aspect-ratio:1;border-radius:14px;border:1px solid rgba(140,220,255,.25);background:linear-gradient(160deg,rgba(30,92,118,.85),rgba(9,42,60,.9));color:#e8f8fb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;font-weight:700;cursor:pointer;padding:0;font-family:inherit}
.lvl-btn .st{font-size:9px;color:#ffd76b;letter-spacing:1px;line-height:1}
.lvl-btn .dim{color:rgba(255,255,255,.2)}
.lvl-btn.locked{opacity:.42;cursor:not-allowed}
.lvl-btn.elite{border-color:rgba(255,215,107,.65);box-shadow:inset 0 0 12px rgba(255,215,107,.16)}
.lvl-btn:not(.locked):active{transform:scale(.94)}
.shop-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(140,220,255,.16);border-radius:14px;padding:10px 12px}
.shop-row .info{flex:1;min-width:0}
.shop-row .nm{font-size:15px;font-weight:600}
.shop-row .ds{font-size:12px;color:#9fc6cf;margin-top:2px}
.shop-row .lv{font-size:12px;color:#ffd76b;margin-top:3px;letter-spacing:2px}
.shop-row .buy{min-width:74px}
.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;width:100%}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(140,220,255,.16);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.card .nm{font-size:14px;font-weight:600}
.card .ds{font-size:11px;color:#9fc6cf;line-height:1.5}
.card.locked{opacity:.55}
.card.locked .nm{color:#8aa5b0}
.card canvas{width:52px;height:52px}
.sec-title{font-size:15px;color:#bfeaf6;letter-spacing:.15em;border-left:3px solid #2dd4bf;padding-left:8px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:15;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#hud .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud .hcol{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:rgba(6,32,46,.6);border:1px solid rgba(140,220,255,.22);border-radius:999px;padding:5px 11px;font-size:12.5px;color:#dff3f7;white-space:nowrap;backdrop-filter:blur(4px)}
.icon-btn{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(140,220,255,.28);background:rgba(6,32,46,.66);color:#dff3f7;font-size:15px;cursor:pointer;font-family:inherit;padding:0;line-height:1}
.icon-btn:active{transform:scale(.93)}
#hud-energy-wrap{position:relative;width:min(62vw,280px);height:18px;border-radius:999px;background:rgba(6,32,46,.66);border:1px solid rgba(140,220,255,.28);overflow:hidden;margin-top:2px}
#energy-fill{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a78bfa,#ffd76b);transition:width .18s ease;border-radius:999px}
#energy-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#eaf9ff;letter-spacing:.2em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#special-ready{color:#ffd76b;font-weight:700;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
#hint{position:absolute;top:15%;left:50%;transform:translateX(-50%);z-index:18;background:rgba(8,38,54,.9);border:1px solid rgba(140,220,255,.4);padding:12px 18px;border-radius:16px;font-size:14.5px;max-width:82vw;text-align:center;line-height:1.6;opacity:0;transition:opacity .45s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#hint.show{opacity:1}
#toast{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);z-index:30;background:rgba(8,38,54,.92);border:1px solid rgba(255,215,107,.45);color:#ffe9b0;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
.stars{font-size:42px;letter-spacing:10px;line-height:1;margin:4px 0}
.stars .star{opacity:.22;display:inline-block}
.stars .star.on{opacity:1;color:#ffd76b;text-shadow:0 0 16px rgba(255,215,107,.85);animation:pop .45s ease both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.big-title{font-size:30px;font-weight:800;letter-spacing:.12em;background:linear-gradient(180deg,#fff,#9fe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.win-coins{color:#ffd76b;font-size:16px;text-align:center}
@media (max-width:480px){.btn{font-size:15px;min-height:44px}.panel{padding:14px}.subtitle{letter-spacing:.3em;text-indent:.3em}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hrow">
    <div class="hcol">
      <div id="hud-level" class="chip">第 1 关</div>
      <div id="hud-goal" class="chip">目标</div>
    </div>
    <div class="hcol">
      <button id="btn-pause" class="icon-btn" type="button" title="暂停">❚❚</button>
      <button id="btn-restart" class="icon-btn" type="button" title="重开">↻</button>
      <button id="btn-home" class="icon-btn" type="button" title="主菜单">☰</button>
    </div>
  </div>
  <div class="hrow">
    <div class="hcol">
      <div id="hud-steps" class="chip">步数 20</div>
      <div id="hud-score" class="chip">分数 0</div>
      <div id="hud-coins" class="chip">金币 0</div>
    </div>
  </div>
  <div id="hud-energy-wrap">
    <div id="energy-fill"></div>
    <div id="energy-text">疗愈能量 <span id="special-ready" class="hidden">· 特殊泡泡就绪</span></div>
  </div>
</div>

<div id="hint"></div>
<div id="toast"></div>

<div id="scr-menu" class="screen active">
  <h1 class="title">泡泡疗愈所</h1>
  <p class="subtitle">BUBBLE HEALING</p>
  <div class="menu">
    <button id="btn-start" class="btn" type="button">开始游戏</button>
    <button id="btn-levels" class="btn ghost" type="button">关卡选择</button>
    <button id="btn-shop" class="btn ghost" type="button">升级商店</button>
    <button id="btn-codex" class="btn ghost" type="button">图鉴</button>
    <button id="btn-daily" class="btn ghost" type="button">每日挑战</button>
    <button id="btn-settings" class="btn ghost" type="button">设置</button>
  </div>
  <p class="tip" style="margin-top:18px">金币 <span id="menu-coins">0</span> · 无尽最高 <span id="menu-endless">第 0 层</span></p>
</div>

<div id="scr-levels" class="screen">
  <div class="panel">
    <h2>关卡选择</h2>
    <div id="level-grid"></div>
    <button id="btn-endless" class="btn gold" type="button">无尽模式</button>
    <button class="btn ghost small btn-back" type="button">返回主菜单</button>
  </div>
</div>

<div id="scr-shop" class="screen">
  <div class="panel">
    <h2>升级商店</h2>
    <p class="tip">金币余额：<span id="shop-coins" style="color:#ffd76b;font-weight:700">0</span>（永久生效）</p>
    <div id="shop-list" style="display:flex;flex-direction:column;gap:9px"></div>
    <button class="btn ghost small btn-back" type="button">返回主菜单</button>
  </div>
</div>

<div id="scr-codex" class="screen">
  <div class="panel">
    <h2>图鉴</h2>
    <div id="codex-list" style="display:flex;flex-direction:column;gap:14px"></div>
    <button class="btn ghost small btn-back" type="button">返回主菜单</button>
  </div>
</div>

<div id="scr-daily" class="screen">
  <div class="panel">
    <h2>每日挑战</h2>
    <p id="daily-info" class="tip"></p>
    <div class="row">
      <button id="btn-daily-start" class="btn" type="button">开始挑战</button>
      <button class="btn ghost small btn-back" type="button">返回主菜单</button>
    </div>
  </div>
</div>

<div id="scr-settings" class="screen">
  <div class="panel">
    <h2>设置</h2>
    <div class="shop-row">
      <div class="info"><div class="nm">音效</div><div class="ds">Web Audio 合成音效，无外部资源</div></div>
      <button id="btn-sound" class="btn small buy" type="button">开</button>
    </div>
    <div class="shop-row">
      <div class="info"><div class="nm">重置进度</div><div class="ds">清空关卡、金币、升级与图鉴</div></div>
      <button id="btn-reset" class="btn small ghost buy" type="button">重置</button>
    </div>
    <p class="tip">《泡泡疗愈所》· 治愈系水族箱泡泡消除<br>所有美术与音效均由代码程序化生成</p>
    <button class="btn ghost small btn-back" type="button">返回主菜单</button>
  </div>
</div>

<div id="scr-pause" class="screen">
  <div class="panel" style="align-items:center">
    <h2>已暂停</h2>
    <p id="pause-goal" class="tip"></p>
    <p class="tip">拖动或移动鼠标瞄准，点击发射泡泡<br>3 个及以上同色泡泡相连即可消除<br>悬空失去支撑的泡泡会掉落并额外计分</p>
    <div class="row" style="flex-direction:column;width:min(80vw,280px)">
      <button id="btn-resume" class="btn" type="button">继续游戏</button>
      <button id="btn-pause-restart" class="btn ghost" type="button">重新开始</button>
      <button id="btn-pause-home" class="btn ghost" type="button">返回主菜单</button>
    </div>
  </div>
</div>

<div id="scr-win" class="screen">
  <div class="panel" style="align-items:center">
    <div id="win-title" class="big-title">通关成功！</div>
    <div id="win-stars" class="stars"></div>
    <div id="win-coins" class="win-coins"></div>
    <div class="row" style="flex-direction:column;width:min(80vw,280px);margin-top:8px">
      <button id="btn-win-next" class="btn" type="button">下一关</button>
      <button id="btn-win-retry" class="btn ghost" type="button">再玩一次</button>
      <button id="btn-win-home" class="btn ghost" type="button">返回主菜单</button>
    </div>
  </div>
</div>

<div id="scr-lose" class="screen">
  <div class="panel" style="align-items:center">
    <div class="big-title" style="background:linear-gradient(180deg,#fff,#ffb36b);-webkit-background-clip:text;background-clip:text">差一点点…</div>
    <p id="lose-reason" class="tip"></p>
    <p id="lose-progress" class="tip"></p>
    <div class="row" style="flex-direction:column;width:min(80vw,280px);margin-top:8px">
      <button id="btn-lose-retry" class="btn" type="button">立即重试</button>
      <button id="btn-lose-home" class="btn ghost" type="button">返回主菜单</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ================= 基础工具 ================= */
var $=function(id){return document.getElementById(id);};
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rand(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function pad2(n){return (n<10?'0':'')+n;}
function seeded(s){var x=(s>>>0)||1;return function(){x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}

/* ================= 存档 ================= */
var SAVE_KEY='bubble_heal_clinic_v1';
function DEF(){return {v:1,unlocked:1,coins:0,stars:{},upg:{bounce:0,aim:0,energy:0,steps:0,luck:0,coin:0},codex:{colors:[],specials:[],obstacles:[],achs:[]},sound:true,daily:{date:'',done:false},endless:{best:0,score:0,depth:1},tutorialDone:false};}
var save=loadSave();
function loadSave(){try{var raw=localStorage.getItem(SAVE_KEY);if(!raw)return DEF();var d=JSON.parse(raw);var base=DEF();for(var k in d){base[k]=d[k];}return base;}catch(e){return DEF();}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function addCoins(n){save.coins+=n;if(save.coins>=1000)checkAch('rich');persist();}

/* ================= 音效（Web Audio 合成） ================= */
var AudioSys={
  ctx:null,master:null,enabled:true,
  init:function(){if(this.ctx)return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.45;this.master.connect(this.ctx.destination);}catch(e){this.ctx=null;}},
  resume:function(){if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},
  tone:function(freq,dur,type,vol,slideTo,delay){
    if(!this.enabled||!this.ctx)return;
    try{
      var t=this.ctx.currentTime+(delay||0);
      var o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
      if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);
    }catch(e){}
  },
  shoot:function(){this.tone(430,0.12,'square',0.09,170);},
  bounce:function(){this.tone(300,0.05,'sine',0.11,230);},
  pop:function(n){var base=470+Math.min(8,n||0)*38;this.tone(base,0.1,'sine',0.17,base*1.5);this.tone(base*1.5,0.13,'triangle',0.07,base*2,0.03);},
  combo:function(c){for(var i=0;i<3;i++)this.tone(510+i*95+(c||0)*28,0.09,'triangle',0.11,null,i*0.06);},
  win:function(){var ns=[523,659,784,1046];for(var i=0;i<ns.length;i++)this.tone(ns[i],0.24,'sine',0.15,null,i*0.13);},
  lose:function(){var ns=[400,330,262];for(var i=0;i<ns.length;i++)this.tone(ns[i],0.26,'sine',0.13,null,i*0.15);},
  click:function(){this.tone(620,0.05,'sine',0.09,820);},
  unlock:function(){this.tone(700,0.1,'sine',0.11,1000);this.tone(920,0.15,'sine',0.09,1240,0.08);}
};
AudioSys.enabled=save.sound;

/* ================= 常量数据 ================= */
var COLORS=[
  {name:'珊瑚粉',main:'#ff8fa3',light:'#ffd2dc',dark:'#d96b82',pat:'dots',patName:'圆点'},
  {name:'湖水青',main:'#4fc3c3',light:'#c0f0f0',dark:'#2f9292',pat:'stripe',patName:'条纹'},
  {name:'暖阳黄',main:'#ffc85c',light:'#ffeab8',dark:'#d99a2e',pat:'triangle',patName:'三角'},
  {name:'薰衣草',main:'#a78bfa',light:'#ddd2ff',dark:'#7a5be0',pat:'wave',patName:'波浪'},
  {name:'嫩芽绿',main:'#79d67f',light:'#cdf3cf',dark:'#46a34d',pat:'cross',patName:'十字'},
  {name:'蜜橘橙',main:'#ff9a5c',light:'#ffd4b3',dark:'#dd6a2c',pat:'star',patName:'星星'}
];
var SPECIALS={bomb:{name:'炸弹泡',desc:'落地时炸开周围一圈泡泡'},rainbow:{name:'彩虹泡',desc:'变为场上最多的颜色并触发消除'},pierce:{name:'穿透泡',desc:'直线穿透并消除途经的泡泡'}};
var OBST={stone:{name:'石泡',desc:'无法消除的坚固障碍'},ice:{name:'冰冻泡',desc:'需要相邻消除两次才能打破'}};
var UPGRADES=[
  {id:'bounce',name:'反弹次数',desc:'泡泡贴墙时可额外反弹一次',max:2,price:[150,320],eff:function(l){return '反弹 '+(1+l)+' 次';}},
  {id:'aim',name:'瞄准辅助线',desc:'辅助线更长，预测更远',max:3,price:[100,220,460],eff:function(l){return '预测 '+(6+l*3)+' 个点位';}},
  {id:'energy',name:'初始疗愈能量',desc:'每关开始时自带能量',max:3,price:[150,320,640],eff:function(l){return '初始能量 '+l*25+'%';}},
  {id:'steps',name:'额外步数',desc:'每关增加一步',max:2,price:[200,420],eff:function(l){return '步数 +'+l;}},
  {id:'luck',name:'特殊泡泡几率',desc:'每个消除的泡泡积累更多能量',max:3,price:[150,320,640],eff:function(l){return '每泡能量 +'+l*2;}},
  {id:'coin',name:'金币收益',desc:'获得的金币提升',max:3,price:[180,380,760],eff:function(l){return '金币 +'+(l*25)+'%';}}
];
var LEVELS=[
  {n:1,colors:2,steps:20,rows:5,goal:{type:'clear',count:10},push:0,stone:0,ice:0,star:0},
  {n:2,colors:3,steps:18,rows:5,goal:{type:'clear',count:20},push:0,stone:0,ice:0,star:0.12},
  {n:3,colors:3,steps:17,rows:5,goal:{type:'clear',count:25},push:0,stone:0.04,ice:0,star:0.12},
  {n:4,colors:3,steps:16,rows:5,goal:{type:'score',target:600},push:0,stone:0,ice:0.05,star:0.12},
  {n:5,colors:4,steps:16,rows:6,goal:{type:'clear',count:35},push:0,stone:0.08,ice:0,star:0.12,elite:true},
  {n:6,colors:4,steps:15,rows:5,goal:{type:'stars',count:4},push:4,stone:0,ice:0.06,star:0.3},
  {n:7,colors:4,steps:15,rows:5,goal:{type:'clear',count:35},push:4,stone:0.05,ice:0.08,star:0.1},
  {n:8,colors:4,steps:14,rows:6,goal:{type:'score',target:800},push:4,stone:0,ice:0.1,star:0.12},

/* ================= 网格几何 ================= */
function rowLen(r){return (r%2===0)?G.cols:G.cols-1;}
function cellX(r,c){return G.offX+c*2*G.R+((r%2===1)?G.R:0);}
function cellY(r){return G.topY+r*G.rowSp+G.R;}
function neighbors(r,c){
  var res=[],d=(r%2===0)?[-1,0]:[0,1];
  var cand=[[r,c-1],[r,c+1],[r-1,c+d[0]],[r-1,c+d[1]],[r+1,c+d[0]],[r+1,c+d[1]]];
  for(var i=0;i<cand.length;i++){var rr=cand[i][0],cc=cand[i][1];
    if(rr>=0&&rr<G.grid.length&&cc>=0&&cc<rowLen(rr))res.push([rr,cc]);}
  return res;
}
function countRemovable(){var n=0;for(var r=0;r<G.grid.length;r++)for(var c=0;c<rowLen(r);c++){var cell=G.grid[r][c];if(cell&&cell.kind!=='stone')n++;}return n;}
function countStars(){var n=0;for(var r=0;r<G.grid.length;r++)for(var c=0;c<rowLen(r);c++){var cell=G.grid[r][c];if(cell&&cell.kind==='star')n++;}return n;}
function dominantColor(){
  var cnt={},r,c,cell,best=-1,bv=-1;
  for(r=0;r<G.grid.length;r++)for(c=0;c<rowLen(r);c++){cell=G.grid[r][c];if(cell&&cell.kind!=='stone')cnt[cell.color]=(cnt[cell.color]||0)+1;}
  for(var k in cnt){if(cnt[k]>bv||(cnt[k]===bv&&Math.random()<0.4)){bv=cnt[k];best=+k;}}
  return best;
}
function buildGrid(cfg){
  var rows=Math.min(cfg.rows,G.maxRows),r,c;
  G.capRows=Math.min(G.maxRows+3,44);
  G.grid=[];
  for(r=0;r<G.capRows;r++)G.grid.push(new Array(rowLen(r)).fill(null));
  for(r=0;r<rows;r++)for(c=0;c<rowLen(r);c++){
    var kind='normal';
    if(r>=2&&Math.random()<(cfg.stone||0))kind='stone';
    else if(r>=1&&Math.random()<(cfg.ice||0))kind='ice';
    else if(Math.random()<(cfg.star||0))kind='star';
    G.grid[r][c]={color:(kind==='stone')?-1:pick(G.colors),kind:kind,hp:(kind==='ice')?2:1};
  }
  if(cfg.goal&&cfg.goal.type==='stars'){
    var cnt=countStars(),need=cfg.goal.count+2,guard=0;
    while(cnt<need&&guard++<300){
      var rr=1+Math.floor(Math.random()*(rows-1)),cc=Math.floor(Math.random()*rowLen(rr));
      var cell=G.grid[rr][cc];
      if(cell&&cell.kind==='normal'){cell.kind='star';cnt++;}
    }
  }
}

function weightedSpecial(){var r=Math.random();if(r<0.42)return 'bomb';if(r<0.77)return 'rainbow';return 'pierce';}
function colorsOnBoard(){
  var seen={},out=[],r,c,cell;
  for(r=0;r<G.grid.length;r++)for(c=0;c<rowLen(r);c++){
    cell=G.grid[r][c];
    if(cell&&cell.kind!=='stone'&&!seen[cell.color]){seen[cell.color]=1;out.push(cell.color);}
  }
  return out;
}
function refillQueue(){
  while(G.queue.length<2){
    var color=pick(G.colors),special=null;
    var rem=countRemovable();
    if(rem<=8){
      var onBoard=colorsOnBoard();
      if(onBoard.length&&(rem<=4||Math.random()<0.8))color=pick(onBoard);
    }
    if(G.specialReady){G.specialReady=false;G.energy=0;special=weightedSpecial();unlockCodex('specials',special);}
    G.queue.push({color:color,special:special});
  }
}

/* ================= 射击与碰撞 ================= */
function shoot(angle){
  if(G.screen!=='game'||G.paused||G.state!=='aim')return;
  var b=currentBall();
  var sp=Math.max(600,G.R*36);
  G.ball={x:G.launcherX,y:G.launcherY-G.R*1.35,vx:Math.sin(angle)*sp,vy:-Math.cos(angle)*sp,color:b.color,special:b.special,bounces:G.bouncesLeft,life:0,pierced:0,piercedStars:0};
  G.queue.shift();refillQueue();
  G.steps--;G.pushCounter++;
  G.state='fly';
  G.showAim=false;
  AudioSys.shoot();
  if(G.mode==='level'&&G.level===1&&G.tutStep===0){G.tutStep=1;showHint(TUT[1]);}
}
function speedNow(){return Math.max(600,G.R*36);}
function findHit(b){
  var rApp=clamp(Math.round((b.y-G.R-G.topY)/G.rowSp),0,Math.max(0,G.grid.length-1));
  var cApp=Math.round((b.x-G.offX-((rApp%2===1)?G.R:0))/(2*G.R));
  var best=null,bd=1e9,r,c,dx,dy,d,cell;
  for(r=Math.max(0,rApp-1);r<=Math.min(G.grid.length-1,rApp+1);r++)
    for(c=Math.max(0,cApp-2);c<=Math.min(rowLen(r)-1,cApp+2);c++){
      cell=G.grid[r][c];if(!cell)continue;
      dx=cellX(r,c)-b.x;dy=cellY(r)-b.y;d=dx*dx+dy*dy;
      if(d<(2*G.R*0.88)*(2*G.R*0.88)&&d<bd){bd=d;best=[r,c];}
    }
  return best;
}
function hitsAny(x,y){
  var rApp=clamp(Math.round((y-G.R-G.topY)/G.rowSp),0,Math.max(0,G.grid.length-1));
  var cApp=Math.round((x-G.offX-((rApp%2===1)?G.R:0))/(2*G.R));
  for(var r=Math.max(0,rApp-1);r<=Math.min(G.grid.length-1,rApp+1);r++)
    for(var c=Math.max(0,cApp-2);c<=Math.min(rowLen(r)-1,cApp+2);c++){
      if(!G.grid[r][c])continue;
      var dx=cellX(r,c)-x,dy=cellY(r)-y;
      if(dx*dx+dy*dy<(2*G.R*0.9)*(2*G.R*0.9))return true;
    }
  return false;
}
function updateBall(dt){
  var b=G.ball;if(!b)return;
  b.life+=dt;
  var sp=speedNow();
  var sub=Math.max(1,Math.ceil(sp*dt/(G.R*0.35)));
  var sdt=dt/sub,i,hit,cell,wasStar;
  for(i=0;i<sub&&G.ball;i++){
    b.x+=b.vx*sdt;b.y+=b.vy*sdt;
    if(b.x<G.WALL_L){b.x=G.WALL_L;b.vx=Math.abs(b.vx);b.bounces--;AudioSys.bounce();burst(b.x,b.y,'#bfeaff',4);
      if(b.bounces<0){if(b.special==='pierce')pierceEnd(b);else fizzle(b);return;}}
    else if(b.x>G.WALL_R){b.x=G.WALL_R;b.vx=-Math.abs(b.vx);b.bounces--;AudioSys.bounce();burst(b.x,b.y,'#bfeaff',4);
      if(b.bounces<0){if(b.special==='pierce')pierceEnd(b);else fizzle(b);return;}}
    if(b.y<G.topY){b.y=G.topY;b.vy=Math.abs(b.vy);}
    if(b.vy>0&&b.y>G.lineY-G.R*1.5){
      if(b.special==='pierce'){pierceEnd(b);return;}
      var cell2=snapBall(b);
      if(cell2){var ball2=b;G.ball=null;landBall(ball2,cell2);}
      else fizzle(b);
      return;
    }
    if(b.y>G.launcherY+G.R*1.5||b.life>5){if(b.special==='pierce')pierceEnd(b);else fizzle(b);return;}
    if(b.special==='pierce'&&b.life>3.2){pierceEnd(b);return;}
    hit=findHit(b);
    if(hit){
      if(b.special==='pierce'){
        cell=G.grid[hit[0]][hit[1]];
        wasStar=cell&&cell.kind==='star';
        if(damageCell(hit[0],hit[1],true)){b.pierced++;if(wasStar)b.piercedStars++;}
      }else{
        cell=snapBall(b);
        if(cell){var ball=b;G.ball=null;landBall(ball,cell);}
        else fizzle(b);
        return;
      }
    }
  }
}
function snapBall(b){
  var r=clamp(Math.round((b.y-G.R-G.topY)/G.rowSp),0,Math.max(0,G.grid.length-1));
  var c=Math.round((b.x-G.offX-((r%2===1)?G.R:0))/(2*G.R));
  var best=null,bs=1e15,dr,dc,rr,cc,d,score,nb;
  for(dr=-2;dr<=2;dr++)for(dc=-3;dc<=3;dc++){
    rr=r+dr;cc=c+dc;
    if(rr<0||rr>=G.grid.length)continue;
    if(cc<0||cc>=rowLen(rr))continue;
    if(G.grid[rr][cc])continue;
    d=(cellX(rr,cc)-b.x)*(cellX(rr,cc)-b.x)+(cellY(rr)-b.y)*(cellY(rr)-b.y);
    nb=neighbors(rr,cc);var has=false;
    for(var i=0;i<nb.length;i++)if(G.grid[nb[i][0]][nb[i][1]]){has=true;break;}
    score=d+(has?0:400000);
    if(score<bs){bs=score;best=[rr,cc];}
  }
  if(!best){
    bs=1e15;
    for(var cc2=0;cc2<rowLen(0);cc2++){
      if(G.grid[0][cc2])continue;
      var d2=(cellX(0,cc2)-b.x)*(cellX(0,cc2)-b.x);
      if(d2<bs){bs=d2;best=[0,cc2];}
    }
  }
  return best;
}
function landBall(b,cell){
  var r=cell[0],c=cell[1];
  var color=b.color,special=b.special;
  if(special==='rainbow'){color=dominantColor();if(color<0)color=pick(G.colors);}
  G.grid[r][c]={color:color,kind:'normal',hp:1};
  if(special==='bomb')explode(r,c);
  else doMatch(r,c,color);
}
function cluster(r,c,color){
  var seen={},stack=[[r,c]],out=[],rr,cc,cell,i,nb;
  seen[r*1000+c]=1;
  while(stack.length){
    var cur=stack.pop();rr=cur[0];cc=cur[1];
    cell=G.grid[rr][cc];if(!cell)continue;
    if(cell.kind==='stone'||cell.color!==color)continue;
    out.push([rr,cc]);
    nb=neighbors(rr,cc);
    for(i=0;i<nb.length;i++){
      var k=nb[i][0]*1000+nb[i][1];
      if(!seen[k]){
        seen[k]=1;
        var n=G.grid[nb[i][0]][nb[i][1]];
        if(n&&n.kind!=='stone'&&n.color===color)stack.push(nb[i]);
      }
    }
  }
  return out;
}
function doMatch(r,c,color){
  var cl=cluster(r,c,color);
  if(cl.length>=3){
    var removed=0,stars=0,i,cell;
    for(i=0;i<cl.length;i++){
      cell=G.grid[cl[i][0]][cl[i][1]];
      if(cell.kind==='ice'&&cell.hp>1){cell.hp=1;crackFx(cellX(cl[i][0],cl[i][1]),cellY(cl[i][0]));continue;}
      if(cell.kind==='star')stars++;
      removeCell(cl[i][0],cl[i][1],cellX(cl[i][0],cl[i][1]),cellY(cl[i][0]));
      removed++;
    }
    popEvent(removed,stars,cellX(r,c),cellY(r,c));
  }
  finishResolve();
}
function explode(r,c){
  var cells=[[r,c]].concat(neighbors(r,c));
  var removed=0,stars=0,i,cell;
  for(i=0;i<cells.length;i++){
    var rr=cells[i][0],cc=cells[i][1];
    cell=G.grid[rr][cc];if(!cell)continue;
    if(cell.kind==='stone')continue;
    if(cell.kind==='ice'&&cell.hp>1){cell.hp=1;crackFx(cellX(rr,cc),cellY(rr,cc));continue;}
    if(cell.kind==='star')stars++;
    removeCell(rr,cc,cellX(rr,cc),cellY(rr,cc));
    removed++;
  }
  ring(cellX(r,c),cellY(r,c),'#ffb36b',G.R*3);
  if(removed>0)popEvent(removed,stars,cellX(r,c),cellY(r,c));
  finishResolve();
}
function damageCell(r,c,pierce){
  var cell=G.grid[r][c];if(!cell)return false;
  var x=cellX(r,c),y=cellY(r,c);
  if(cell.kind==='stone'){if(pierce)burst(x,y,'#cfd8e3',4);AudioSys.bounce();return false;}
  if(cell.kind==='ice'){
    cell.hp--;
    if(cell.hp>0){crackFx(x,y);AudioSys.bounce();return false;}
  }
  removeCell(r,c,x,y);
  return true;
}
function removeCell(r,c,x,y){
  var cell=G.grid[r][c];if(!cell)return;
  G.grid[r][c]=null;
  var col=(cell.kind==='stone')?'#b8c4d4':(cell.kind==='ice'?'#cfefff':COLORS[cell.color].main);
  burst(x,y,col,cell.kind==='star'?10:7);
  ring(x,y,cell.kind==='star'?'#ffd76b':'#ffffff',G.R*1.6);
  G.progress.popped++;
  if(cell.kind==='star')G.progress.stars++;
  gainEnergy(6+save.upg.luck*2);
  G.score+=5;
}
function popEvent(removed,stars,x,y){
  if(removed<=0)return;
  G.comboTimer=2.2;G.combo++;
  if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  gainEnergy(G.combo*3);
  var mult=Math.max(1,G.combo);
  var pts=removed*10*mult;
  G.score+=pts;
  addText(x,y,'+'+pts,'#ffffff');
  if(G.combo>=2){addText(x,y-26,'连击 x'+G.combo,'#ffd76b');AudioSys.combo(G.combo);}
  else AudioSys.pop(G.combo);
  if(stars>0){G.progress.stars+=stars;addText(x,y+24,'★ +'+stars,'#ffd76b');}
  G.progress.popped+=0;
  if(G.combo>=5)checkAch('combo5');
  if(G.mode==='level'&&G.level===1&&G.tutStep===1){G.tutStep=2;showHint(TUT[2]);}
}
function dropFloating(){
  var seen={},stack=[],r,c,i;
  for(c=0;c<rowLen(0);c++)if(G.grid[0][c]){seen[c]=1;stack.push([0,c]);}
  while(stack.length){
    var cur=stack.pop();
    var nb=neighbors(cur[0],cur[1]);
    for(i=0;i<nb.length;i++){
      var k=nb[i][0]*1000+nb[i][1];
      if(!seen[k]&&G.grid[nb[i][0]][nb[i][1]]){seen[k]=1;stack.push(nb[i]);}
    }
  }
  var n=0;
  for(r=0;r<G.grid.length;r++)for(c=0;c<rowLen(r);c++){
    if(G.grid[r][c]&&!seen[r*1000+c]){
      var cell=G.grid[r][c];
      G.drops.push({x:cellX(r,c),y:cellY(r,c),vx:rand(-36,36),vy:rand(-60,10),color:cell.color,kind:cell.kind});
      G.grid[r][c]=null;n++;
      G.progress.popped++;
      if(cell.kind==='star')G.progress.stars++;
      gainEnergy(4);
    }
  }
  if(n>0){G.score+=n*20;addText(G.launcherX,G.lineY-46,'掉落 '+n+' 个 +'+(n*20),'#8ef0ff');AudioSys.pop(4);}
}
function fizzle(b){
  G.ball=null;G.state='resolve';
  burst(b.x,b.y,'#9fd8e8',6);
  G.pending={t:0.25,fn:finishResolve};
}
function pierceEnd(b){
  if(b.pierced>0)popEvent(b.pierced,b.piercedStars,b.x,b.y);
  G.ball=null;G.state='resolve';
  burst(b.x,b.y,'#cfeaff',10);
  G.pending={t:0.3,fn:finishResolve};
}
function pendingEnd(t,fn){G.state='resolve';G.pending={t:t,fn:fn};}
function finishResolve(){
  dropFloating();
  if(goalMet()){pendingEnd(0.55,winGame);return;}
  if(G.steps<=0){pendingEnd(0.55,function(){loseGame('步数用完了');});return;}
  if(G.pushEvery>0&&G.pushCounter>=G.pushEvery){
    G.pushCounter=0;
    if(pushRowDown())return;
  }
  G.state='aim';
}
function pushRowDown(){
  var row=new Array(G.cols).fill(null),c;
  var stoneP=G.cfg.stone||0,iceP=G.cfg.ice||0;
  for(c=0;c<G.cols;c++){
    var kind='normal',rv=Math.random();
    if(rv<stoneP)kind='stone';
    else if(rv<stoneP+iceP)kind='ice';
    else if(Math.random()<(G.cfg.star||0))kind='star';
    row[c]={color:(kind==='stone')?-1:pick(G.colors),kind:kind,hp:(kind==='ice')?2:1};
  }
  G.grid.unshift(row);
  var i,lost;
  for(i=0;i<G.grid.length;i++){
    var want=rowLen(i);
    while(G.grid[i].length>want){
      lost=G.grid[i].pop();
      if(lost){
        if(want>0&&!G.grid[i][want-1])G.grid[i][want-1]=lost;
        else{removeCell(i,want,cellX(i,want),cellY(i));}
      }
    }
  }
  if(G.cfg.stone)unlockCodex('obstacles','stone');
  if(G.cfg.ice)unlockCodex('obstacles','ice');
  var dr=deepestRow();
  if(dr>=0&&cellY(dr)+G.R>G.lineY){pendingEnd(0.4,function(){loseGame('泡泡压到了发射线');});return true;}
  while(G.grid.length>(G.capRows||G.maxRows+3)){
    var lastRow=G.grid[G.grid.length-1],empty=true;
    for(var cc2=0;cc2<lastRow.length;cc2++)if(lastRow[cc2]){empty=false;break;}
    if(empty)G.grid.pop();else break;
  }
  return false;
}
function deepestRow(){
  for(var r=G.grid.length-1;r>=0;r--){
    for(var c=0;c<rowLen(r);c++)if(G.grid[r][c])return r;
  }
  return -1;
}
function goalMet(){
  var g=G.cfg.goal;
  if(g.type==='clear')return G.progress.popped>=g.count;
  if(g.type==='stars')return G.progress.stars>=g.count;
  if(g.type==='score')return G.score>=g.target;
  if(g.type==='clearall')return countRemovable()===0;
  return false;
}
function goalText(){
  var g=G.cfg.goal;
  if(g.type==='clear')return '消除泡泡 '+Math.min(G.progress.popped,g.count)+'/'+g.count;
  if(g.type==='stars')return '收集星星泡 '+Math.min(G.progress.stars,g.count)+'/'+g.count;
  if(g.type==='score')return '分数 '+Math.min(G.score,g.target)+'/'+g.target;
  if(g.type==='clearall')return '清除全部泡泡 · 剩 '+countRemovable();
  return '';
}
function calcStars(){
  var s=1;
  var leftRatio=G.stepsMax>0?(G.steps/G.stepsMax):0;
  if(leftRatio>=0.3)s++;
  var par=(G.cfg.goal.type==='score')?(G.cfg.goal.target*1.3):(G.stepsMax*110);
  if(G.score>=par||G.maxCombo>=3)s++;
  return clamp(s,1,3);
}
function winGame(){
  if(G.state==='over')return;
  G.state='over';
  AudioSys.win();
  var stars=calcStars(),coins=0;
  if(G.mode==='daily'){
    var today=todayStr();
    if(save.daily.date!==today||!save.daily.done){
      save.daily={date:today,done:true};coins=40;checkAch('daily');toast('每日挑战奖励 +40 金币');
    }else{coins=Math.round(10*(1+0.25*save.upg.coin));toast('今日奖励已领取，获得少量金币');}
  }else{
    coins=Math.round((15+stars*8+(G.cfg.elite?15:0))*(1+0.25*save.upg.coin));
  }
  addCoins(coins);
  if(G.mode==='level'){
    var prev=save.stars[G.level]||0;
    save.stars[G.level]=Math.max(prev,stars);
    if(G.level===1)save.tutorialDone=true;
    save.unlocked=Math.max(save.unlocked,Math.min(20,G.level+1));
    checkAch('first_win');
    if(G.level===5||G.level===10||G.level===15||G.level===20)checkAch('lv'+G.level);
    if(stars===3)checkAch('star3');
  }else if(G.mode==='endless'){
    var d=G.endlessDepth;
    save.endless.best=Math.max(save.endless.best,d);
    save.endless.score=Math.max(save.endless.score,G.score);
    save.endless.depth=d+1;
    if(d>=10)checkAch('endless10');
  }
  persist();
  $('win-title').textContent=(G.mode==='endless')?('深入第 '+G.endlessDepth+' 层！'):(G.mode==='daily'?'每日挑战完成！':'通关成功！');
  var sh='';
  for(var i=0;i<3;i++)sh+='<span class="star'+(i<stars?' on':'')+'" style="animation-delay:'+(i*0.18)+'s">★</span>';
  $('win-stars').innerHTML=sh;
  $('win-coins').textContent='获得金币 +'+coins+(G.cfg.elite&&G.mode==='level'?'（精英关加成）':'');
  $('btn-win-next').textContent=(G.mode==='endless')?'继续深入':(G.mode==='daily'?'返回主菜单':'下一关');
  for(var k=0;k<26;k++){
    G.particles.push({x:rand(0,W),y:rand(-40,H*0.4),vx:rand(-60,60),vy:rand(40,160),r:rand(2,5),life:rand(1.2,2.2),max:2.2,color:pick(COLORS).main});
  }
  show('scr-win');
}
function loseGame(reason){
  if(G.state==='over')return;
  G.state='over';
  AudioSys.lose();
  $('lose-reason').textContent='失败原因：'+reason;
  $('lose-progress').textContent=goalText()+' · 分数 '+G.score;
  show('scr-lose');
}

/* ================= 特效 ================= */
function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a=rand(0,Math.PI*2),sp=rand(60,230);
    G.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rand(1.6,4),life:rand(.35,.8),max:.8,color:color});
  }
}
function ring(x,y,color,max){G.rings.push({x:x,y:y,r:G.R*0.5,max:max||G.R*1.6,life:.36,max2:.36,color:color});}
function crackFx(x,y){G.rings.push({x:x,y:y,r:G.R*0.3,max:G.R*0.9,life:.3,max2:.3,color:'#dff6ff'});}
function addText(x,y,text,color){G.texts.push({x:x,y:y,text:text,color:color,life:.95});}
function updateEffects(dt){
  var i,p;
  for(i=G.particles.length-1;i>=0;i--){p=G.particles[i];p.life-=dt;if(p.life<=0){G.particles.splice(i,1);continue;}p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(i=G.rings.length-1;i>=0;i--){var r=G.rings[i];r.life-=dt;if(r.life<=0){G.rings.splice(i,1);continue;}r.r+=(r.max-r.r)*Math.min(1,dt*9);}
  for(i=G.texts.length-1;i>=0;i--){var tx=G.texts[i];tx.life-=dt;tx.y-=36*dt;if(tx.life<=0)G.texts.splice(i,1);}
  for(i=G.drops.length-1;i>=0;i--){var d=G.drops[i];d.vy+=1500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>H+60)G.drops.splice(i,1);}
}

/* ================= 绘制 ================= */
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function gloss(x,y,R){
  ctx.fillStyle='rgba(255,255,255,.42)';
  ctx.beginPath();ctx.ellipse(x-R*0.32,y-R*0.38,R*0.28,R*0.17,-0.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.beginPath();ctx.arc(x+R*0.2,y-R*0.48,R*0.09,0,Math.PI*2);ctx.fill();
}
function drawStarPath(cx,cy,R0,r1,n){
  ctx.beginPath();
  for(var i=0;i<n*2;i++){
    var a=-Math.PI/2+i*Math.PI/n,rr=(i%2)?r1:R0;
    var px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;
    if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function drawPattern(x,y,R,col){
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.lineWidth=Math.max(1.2,R*0.09);ctx.lineCap='round';
  var p=col.pat,i;
  if(p==='dots'){
    var ds=[[-0.3,-0.14],[0.28,-0.04],[-0.02,0.32]];
    for(i=0;i<3;i++){ctx.beginPath();ctx.arc(x+ds[i][0]*R,y+ds[i][1]*R,R*0.11,0,Math.PI*2);ctx.fill();}
  }else if(p==='stripe'){
    for(i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*R*0.3,y-R*0.45);ctx.lineTo(x+i*R*0.3,y+R*0.45);ctx.stroke();}
  }else if(p==='triangle'){
    ctx.beginPath();ctx.moveTo(x,y-R*0.4);ctx.lineTo(x+R*0.4,y+R*0.3);ctx.lineTo(x-R*0.4,y+R*0.3);ctx.closePath();ctx.stroke();
  }else if(p==='wave'){
    ctx.beginPath();
    for(i=0;i<=20;i++){var px=x-R*0.5+R*i/20,py=y+Math.sin(i/20*Math.PI*2)*R*0.16;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
    ctx.stroke();
  }else if(p==='cross'){
    ctx.beginPath();ctx.moveTo(x-R*0.32,y);ctx.lineTo(x+R*0.32,y);ctx.moveTo(x,y-R*0.32);ctx.lineTo(x,y+R*0.32);ctx.stroke();
  }else if(p==='star'){
    drawStarPath(x,y,R*0.36,R*0.16,5);ctx.stroke();
  }
  ctx.restore();
}
function drawStarBadge(x,y,R){
  ctx.save();
  ctx.fillStyle='rgba(255,215,107,.95)';ctx.strokeStyle='rgba(120,80,10,.45)';ctx.lineWidth=Math.max(1,R*0.06);
  drawStarPath(x,y+R*0.02,R*0.4,R*0.18,5);ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawBubble(x,y,R,ci,kind,hp){
  ctx.save();
  if(R<=0){ctx.restore();return;}
  if(kind==='stone'){
    var g=ctx.createRadialGradient(x-R*0.3,y-R*0.3,R*0.1,x,y,R);
    g.addColorStop(0,'#aeb9c9');g.addColorStop(0.6,'#7d8a9e');g.addColorStop(1,'#4d5867');
    ctx.fillStyle=g;circle(x,y,R);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=Math.max(1,R*0.08);
    ctx.beginPath();ctx.moveTo(x-R*0.4,y-R*0.1);ctx.lineTo(x-R*0.05,y+R*0.15);ctx.lineTo(x+R*0.3,y-R*0.05);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+R*0.1,y-R*0.45);ctx.lineTo(x-R*0.1,y+R*0.05);ctx.stroke();
    gloss(x,y,R);
  }else if(kind==='ice'){
    var g2=ctx.createRadialGradient(x-R*0.3,y-R*0.3,R*0.1,x,y,R);
    g2.addColorStop(0,'#eafbff');g2.addColorStop(0.55,'#a8dcf0');g2.addColorStop(1,'#6db4d8');
    ctx.fillStyle=g2;circle(x,y,R);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1,R*0.09);
    for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(x,y,R*(0.3+i*0.22),i*1.2,i*1.2+2.2);ctx.stroke();}
    if(hp<2){
      ctx.strokeStyle='rgba(40,80,110,.85)';ctx.lineWidth=Math.max(1.5,R*0.12);
      ctx.beginPath();ctx.moveTo(x-R*0.5,y-R*0.2);ctx.lineTo(x,y+R*0.12);ctx.lineTo(x+R*0.42,y-R*0.4);ctx.stroke();
    }
    gloss(x,y,R);
  }else{
    var col=COLORS[ci]||COLORS[0];
    var g3=ctx.createRadialGradient(x-R*0.35,y-R*0.4,R*0.1,x,y,R);
    g3.addColorStop(0,col.light);g3.addColorStop(0.45,col.main);g3.addColorStop(1,col.dark);
    ctx.fillStyle=g3;circle(x,y,R);ctx.fill();
    drawPattern(x,y,R,col);
    gloss(x,y,R);
    if(kind==='star')drawStarBadge(x,y,R);
  }
  ctx.restore();
}
function drawSpecialOverlay(x,y,R,sp){
  ctx.save();
  if(sp==='bomb'){
    ctx.fillStyle='rgba(22,15,42,.93)';circle(x,y,R);ctx.fill();
    ctx.strokeStyle='#ffd76b';ctx.lineWidth=Math.max(1.5,R*0.12);
    ctx.beginPath();ctx.moveTo(x+R*0.22,y-R*0.72);ctx.quadraticCurveTo(x+R*0.72,y-R*0.98,x+R*0.44,y-R*1.22);ctx.stroke();
    ctx.fillStyle='#fff2b8';
    ctx.beginPath();ctx.arc(x+R*0.44,y-R*1.28,R*0.14+Math.sin(t*20)*R*0.03,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.45)';
    ctx.beginPath();ctx.ellipse(x-R*0.3,y-R*0.32,R*0.26,R*0.15,-0.6,0,Math.PI*2);ctx.fill();
  }else if(sp==='rainbow'){
    ctx.save();circle(x,y,R);ctx.clip();
    for(var i=0;i<6;i++){ctx.fillStyle=COLORS[i].main;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R,i*Math.PI/3,(i+1)*Math.PI/3);ctx.closePath();ctx.fill();}
    ctx.restore();
    gloss(x,y,R);
  }else if(sp==='pierce'){
    var g=ctx.createRadialGradient(x,y,R*0.1,x,y,R);
    g.addColorStop(0,'#ffffff');g.addColorStop(0.7,'#cfeaff');g.addColorStop(1,'#7cc4f5');
    ctx.fillStyle=g;circle(x,y,R);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=Math.max(1.5,R*0.1);
    ctx.beginPath();ctx.moveTo(x-R*0.3,y);ctx.lineTo(x+R*0.08,y);
    ctx.moveTo(x-R*0.06,y-R*0.26);ctx.lineTo(x+R*0.32,y);ctx.lineTo(x-R*0.06,y+R*0.26);ctx.stroke();
    gloss(x,y,R);
  }
  ctx.restore();
}
function drawBackground(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#07334a');g.addColorStop(0.45,'#0a4a56');g.addColorStop(1,'#0d5f5e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i,b,bx,by,rr,rg;
  for(i=0;i<bg.blobs.length;i++){
    b=bg.blobs[i];
    bx=(b.x+Math.sin(t*b.s+i)*0.06)*W;
    by=(b.y+Math.cos(t*b.s*0.8+i)*0.05)*H;
    rr=b.r*Math.min(W,H);
    rg=ctx.createRadialGradient(bx,by,0,bx,by,rr);
    rg.addColorStop(0,'rgba(80,220,210,0.10)');rg.addColorStop(1,'rgba(80,220,210,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  for(i=0;i<bg.parts.length;i++){
    var p=bg.parts[i];
    ctx.globalAlpha=p.a*(0.6+0.4*Math.sin(t*1.5+p.ph));
    ctx.fillStyle='#bff6ff';
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawGrid(){
  for(var r=0;r<G.grid.length;r++)for(var c=0;c<rowLen(r);c++){
    var cell=G.grid[r][c];if(!cell)continue;
    var s=1+Math.sin(t*1.8+r*0.7+c*0.9)*0.012;
    drawBubble(cellX(r,c),cellY(r),G.R*0.94*s,cell.color,cell.kind,cell.hp);
  }
}
function drawDrops(){
  for(var i=0;i<G.drops.length;i++){
    var d=G.drops[i];
    drawBubble(d.x,d.y,G.R*0.9,d.color,d.kind,1);
  }
}
function drawAim(){
  if(G.state!=='aim'||G.paused||G.screen!=='game')return;
  if(!(G.aiming||G.showAim))return;
  var pts=predictPath(G.aimAngle),i,a,last;
  for(i=0;i<pts.length;i++){
    a=0.6*(1-i/pts.length)+0.1;
    ctx.fillStyle='rgba(200,245,255,'+a+')';
    ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,Math.max(2,G.R*0.15*(1-i/pts.length*0.5)),0,Math.PI*2);ctx.fill();
  }
  last=pts[pts.length-1];
  if(last){
    ctx.strokeStyle='rgba(200,245,255,.45)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(last.x,last.y,G.R*0.72,0,Math.PI*2);ctx.stroke();
  }
}
function predictPath(angle){
  var pts=[],x=G.launcherX,y=G.launcherY-G.R*1.35;
  var vx=Math.sin(angle)*270,vy=-Math.cos(angle)*270;
  var bounces=G.bouncesLeft,maxPts=6+save.upg.aim*3,i,k;
  for(i=0;i<maxPts;i++){
    for(k=0;k<3;k++){
      x+=vx*0.008;y+=vy*0.008;
      if(x<G.WALL_L){x=G.WALL_L;vx=Math.abs(vx);bounces--;}
      else if(x>G.WALL_R){x=G.WALL_R;vx=-Math.abs(vx);bounces--;}
      if(y<G.topY){y=G.topY;vy=Math.abs(vy);}
    }
    pts.push({x:x,y:y});
    if(bounces<0)break;
    if(hitsAny(x,y))break;
  }
  return pts;
}
function drawLauncher(){
  var x=G.launcherX,y=G.launcherY;
  var g=ctx.createRadialGradient(x,y,0,x,y,G.R*2.6);
  g.addColorStop(0,'rgba(120,230,255,.26)');g.addColorStop(1,'rgba(120,230,255,0)');
  ctx.fillStyle=g;ctx.fillRect(x-G.R*2.6,y-G.R*2.6,G.R*5.2,G.R*5.2);
  ctx.fillStyle='rgba(8,40,58,.92)';
  ctx.strokeStyle='rgba(150,230,255,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y+G.R*0.9,G.R*1.15,Math.PI*1.15,Math.PI*1.85);ctx.closePath();ctx.fill();ctx.stroke();
  if(G.state==='aim'&&!G.paused&&G.screen==='game'){
    ctx.strokeStyle='rgba(180,240,255,.75)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x,y+G.R*0.5);
    ctx.lineTo(x+Math.sin(G.aimAngle)*G.R*1.35,y+G.R*0.5-Math.cos(G.aimAngle)*G.R*1.35);
    ctx.stroke();
  }
  var cb=currentBall();
  if(cb&&!G.ball&&G.state!=='over'){
    if(cb.special)drawSpecialOverlay(x,y-G.R*1.35,G.R,cb.special);
    else drawBubble(x,y-G.R*1.35,G.R,cb.color,'normal',1);
  }
  var nb=G.queue[1];
  if(nb){
    var nx=x+G.R*2.5,ny=y-G.R*0.4;
    ctx.globalAlpha=.92;
    if(nb.special)drawSpecialOverlay(nx,ny,G.R*0.68,nb.special);
    else drawBubble(nx,ny,G.R*0.68,nb.color,'normal',1);
    ctx.globalAlpha=1;
  }
  if(G.specialReady||specialNext()){
    ctx.fillStyle='rgba(255,215,107,'+(0.55+0.4*Math.sin(t*6))+')';
    drawStarPath(x+G.R*1.15,y-G.R*1.95,G.R*0.22,G.R*0.1,5);ctx.fill();
  }
}
function drawBall(){
  var b=G.ball;if(!b)return;
  if(b.special)drawSpecialOverlay(b.x,b.y,G.R,b.special);
  else drawBubble(b.x,b.y,G.R,b.color,'normal',1);
}
function drawEffects(){
  var i;
  for(i=0;i<G.rings.length;i++){
    var r=G.rings[i],a=r.life/r.max2;
    ctx.globalAlpha=a*0.8;ctx.strokeStyle=r.color;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(i=0;i<G.particles.length;i++){
    var p=G.particles[i],pa=Math.max(0,p.life/p.max);
    ctx.globalAlpha=pa;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*pa+0.4,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(i=0;i<G.texts.length;i++){
    var tx=G.texts[i],ta=Math.max(0,Math.min(1,tx.life/0.5));
    ctx.globalAlpha=ta;
    ctx.font='700 16px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle=tx.color;
    ctx.strokeStyle='rgba(0,20,30,.5)';ctx.lineWidth=3;
    ctx.strokeText(tx.text,tx.x,tx.y);ctx.fillText(tx.text,tx.x,tx.y);
  }
  ctx.globalAlpha=1;
}
function render(){
  drawBackground();
  if(G.grid.length&&(G.screen==='game')){
    drawGrid();
    drawDrops();
    drawAim();
    drawLauncher();
    drawBall();
    drawEffects();
  }
}

function mkMini(ci,kind,special){
  var c=document.createElement('canvas');c.width=104;c.height=104;

  var oldCtx=ctx;ctx=cc;
  if(special)drawSpecialOverlay(52,52,44,special);
  else drawBubble(52,52,44,ci,kind,1);
  ctx=oldCtx;
  return c;
}

/* ================= 输入 ================= */
var aiming=false;
function aimFromEvent(e){
  var rect=cv.getBoundingClientRect();
  var px=e.clientX-rect.left,py=e.clientY-rect.top;
  var a=Math.atan2(px-G.launcherX,G.launcherY-py);
  G.aimAngle=clamp(a,-1.35,1.35);
}
cv.addEventListener('pointerdown',function(e){
  AudioSys.init();AudioSys.resume();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  aiming=true;G.aiming=true;G.showAim=true;
  aimFromEvent(e);
  if(e.preventDefault)e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',function(e){
  aimFromEvent(e);
  if(e.pointerType==='mouse'||aiming)G.showAim=true;
},{passive:false});
cv.addEventListener('pointerup',function(e){
  if(aiming){
    aiming=false;G.aiming=false;
    aimFromEvent(e);
    if(G.screen==='game'&&!G.paused&&G.state==='aim')shoot(G.aimAngle);
  }
},{passive:false});
cv.addEventListener('pointercancel',function(){aiming=false;G.aiming=false;},{passive:false});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('touchmove',function(e){if(e.target===cv&&e.preventDefault)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('pointerdown',function(){AudioSys.init();AudioSys.resume();});

/* ================= UI 事件绑定 ================= */
function bindUI(){
  $('btn-start').addEventListener('click',function(){AudioSys.click();startLevel(save.unlocked,'level');});
  $('btn-levels').addEventListener('click',function(){AudioSys.click();renderLevels();show('scr-levels');});
  $('btn-shop').addEventListener('click',function(){AudioSys.click();renderShop();show('scr-shop');});
  $('btn-codex').addEventListener('click',function(){AudioSys.click();renderCodex();show('scr-codex');});
  $('btn-daily').addEventListener('click',function(){AudioSys.click();renderDaily();show('scr-daily');});
  $('btn-settings').addEventListener('click',function(){AudioSys.click();renderSettings();show('scr-settings');});
  var backs=document.querySelectorAll('.btn-back');
  for(var i=0;i<backs.length;i++)backs[i].addEventListener('click',function(){AudioSys.click();goMenu();});
  $('level-grid').addEventListener('click',function(e){
    var btn=e.target.closest?e.target.closest('.lvl-btn'):null;
    if(!btn||btn.disabled)return;
    AudioSys.click();
    startLevel(parseInt(btn.dataset.lvl,10),'level');
  });
  $('btn-endless').addEventListener('click',function(){
    if($('btn-endless').disabled)return;
    AudioSys.click();startEndless();
  });  $('shop-list').addEventListener('click',function(e){
    var btn=e.target.closest?e.target.closest('[data-upg]'):null;
    if(!btn||btn.disabled)return;
    var id=btn.dataset.upg,u=null;
    for(var i=0;i<UPGRADES.length;i++)if(UPGRADES[i].id===id)u=UPGRADES[i];
    if(!u)return;
    var lv=save.upg[id]||0;
    if(lv>=u.max)return;
    var price=u.price[lv];
    if(save.coins<price){toast('金币不足，还需 '+(price-save.coins)+' 金币');return;}
    save.coins-=price;save.upg[id]=lv+1;persist();
    AudioSys.unlock();toast(u.name+' 升级到 Lv.'+(lv+1));
    renderShop();renderMenu();
  });
  $('btn-sound').addEventListener('click',function(){
    save.sound=!save.sound;AudioSys.enabled=save.sound;persist();
    $('btn-sound').textContent=save.sound?'开':'关';
    if(save.sound){AudioSys.init();AudioSys.resume();AudioSys.click();}
  });
  $('btn-reset').addEventListener('click',function(){
    var btn=$('btn-reset');
    if(btn.dataset.confirm==='1'){
      save=DEF();persist();
      AudioSys.enabled=save.sound;
      btn.dataset.confirm='';btn.textContent='已重置';
      toast('进度已重置');
      setTimeout(function(){renderSettings();renderMenu();},600);
    }else{
      btn.dataset.confirm='1';btn.textContent='确认重置？';
      setTimeout(function(){if(btn.dataset.confirm==='1'){btn.dataset.confirm='';btn.textContent='重置';}},2500);
    }
  });
  $('btn-daily-start').addEventListener('click',function(){AudioSys.click();startLevel(0,'daily');});
  $('btn-pause').addEventListener('click',function(){AudioSys.click();pauseGame();});
  $('btn-restart').addEventListener('click',function(){AudioSys.click();restart();});
  $('btn-home').addEventListener('click',function(){AudioSys.click();goMenu();});
  $('btn-resume').addEventListener('click',function(){AudioSys.click();resumeGame();});
  $('btn-pause-restart').addEventListener('click',function(){AudioSys.click();restart();});
  $('btn-pause-home').addEventListener('click',function(){AudioSys.click();goMenu();});
  $('btn-win-retry').addEventListener('click',function(){AudioSys.click();restart();});
  $('btn-win-home').addEventListener('click',function(){AudioSys.click();goMenu();});
  $('btn-win-next').addEventListener('click',function(){
    AudioSys.click();
    if(G.mode==='endless'){save.endless.depth=G.endlessDepth+1;persist();startLevel(0,'endless');}
    else if(G.mode==='daily'){goMenu();}
    else{
      var nx=Math.min(20,G.level+1);
      if(G.level>=20){goMenu();}
      else startLevel(nx,'level');
    }
  });
  $('btn-lose-retry').addEventListener('click',function(){AudioSys.click();restart();});
  $('btn-lose-home').addEventListener('click',function(){AudioSys.click();goMenu();});
}

/* ================= 主循环 ================= */
function update(dt){
  t+=dt;
  var i;
  for(i=0;i<bg.parts.length;i++){
    var p=bg.parts[i];
    p.y-=p.v*dt;
    if(p.y<-0.05){p.y=1.05;p.x=Math.random();}
  }
  if(G.screen!=='game'||G.paused)return;
  if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}
  if(G.state==='fly')updateBall(dt);
  if(G.pending){
    G.pending.t-=dt;
    if(G.pending.t<=0){var fn=G.pending.fn;G.pending=null;fn();}
  }
  updateEffects(dt);
  updateHUD();
}
var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  if(dt<0)dt=0;
  update(dt);
  render();
}
bindUI();
renderMenu();
show('scr-menu');
requestAnimationFrame(loop);
})();
</script>
